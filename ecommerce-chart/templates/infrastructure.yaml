# ecommerce-chart/templates/infrastructure.yaml

# --- POSTGRESQL 18 DATABASE ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: {{ .Values.infrastructure.postgres.image | quote }}
        env:
        - name: POSTGRES_DB
          value: {{ .Values.infrastructure.postgres.dbName | quote }}
        - name: POSTGRES_USER
          value: {{ .Values.infrastructure.postgres.user | quote }}
        - name: POSTGRES_PASSWORD
          value: {{ .Values.infrastructure.postgres.password | quote }}
        ports:
        - containerPort: {{ .Values.infrastructure.postgres.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  ports:
  - port: {{ .Values.infrastructure.postgres.port }}
  selector:
    app: postgres

---
# --- REDIS CACHE ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: {{ .Values.infrastructure.redis.image | quote }}
        ports:
        - containerPort: {{ .Values.infrastructure.redis.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  ports:
  - port: {{ .Values.infrastructure.redis.port }}
  selector:
    app: redis

---
# --- KAFKA EVENT BACKBONE DEPENDENCIES ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
spec:
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.5.0
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service
spec:
  ports:
  - port: 2181
  selector:
    app: zookeeper
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
spec:
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: {{ .Values.infrastructure.kafka.image | quote }}
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper-service:2181"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka-service:9092"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
spec:
  ports:
  - port: {{ .Values.infrastructure.kafka.port }}
  selector:
    app: kafka